# Real OpenWrt, booted with KVM-accelerated QEMU inside this container, with
# a tap-device link so the guest's own LAN address (192.168.1.1, OpenWrt's
# static default — it never runs a DHCP client on its LAN interface) is
# directly reachable rather than hidden behind QEMU's simplistic usermode
# NAT. See docker/README.md for the full story, exact commands, and the
# two earlier candidate approaches that didn't pan out on Docker Desktop.
#
# Before first run: bash docker/fetch-boot-image.sh
services:
  openwrt:
    build:
      context: .
      dockerfile: Dockerfile.qemu-direct
    container_name: openwrt
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    volumes:
      - ./boot-image/boot.img:/boot.img
    ports:
      - "8081:80"   # LuCI / uhttpd (and, once built, /api/*)
      - "2223:22"   # SSH (dropbear)
    restart: unless-stopped
