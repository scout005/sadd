version: "3"
services:
  openwrt:
    image: qemux/qemu
    container_name: openwrt
    environment:
      BOOT: "https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-23.05.5-x86-64-generic-ext4-combined.img.gz"
      DISK_SIZE: "1G"
      RAM_SIZE: "256M"
      CPU_CORES: "1"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:80"     # LuCI web UI
      - "2222:22"     # SSH
    volumes:
      - ./openwrt-data:/storage
    restart: unless-stopped