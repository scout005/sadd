<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Sadd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    color-scheme: light;
    --teal:#0D9488; --teal-dark:#0F766E; --teal-light:#CCFBF1; --teal-tint:#F0FDFA;
    --success:#16A34A; --success-tint:#F0FDF4;
    --warning:#D97706; --warning-tint:#FFFBEB;
    --error:#DC2626; --error-tint:#FEF2F2;
    --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --muted:#64748B; --muted-2:#94A3B8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#EEF2F6;color:var(--text);}
  svg{display:block;}
  h1,h2,h3,strong,label,.btn{font-family:'Baloo 2',cursive;}

  .phone{width:375px;max-width:100vw;height:790px;max-height:100vh;background:#0B1120;border-radius:52px;padding:12px;margin:20px auto;box-shadow:0 40px 70px -25px rgba(15,23,42,.45);}
  .phone-inner{width:100%;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#0B1120;border-radius:12px;z-index:5;}
  .statusbar{height:46px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600;}
  .p-scroll{flex:1;overflow-y:auto;}
  .p-content{padding:8px 22px 32px;}

  .brand-row{display:flex;align-items:center;gap:9px;margin:6px 0 24px;}
  .brand-mark{width:32px;height:32px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-word{font-weight:800;font-size:17px;color:var(--text);}

  h1.scr-title{font-size:21px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  p.scr-sub{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.5;font-family:'Nunito',sans-serif;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text);font-family:'Nunito',sans-serif;}
  .input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:14px;font-family:'Nunito',sans-serif;font-size:14.5px;color:var(--text);background:#fff;}
  .input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light);}

  .btn{width:100%;border:none;border-radius:999px;font-weight:700;font-size:14.5px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 8px 18px -8px rgba(13,148,136,.55);}
  .btn-secondary{background:#fff;color:var(--text);border:1.5px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--teal-dark);font-weight:700;}
  .btn-danger-soft{background:var(--error-tint);color:var(--error);}
  .mt-24{margin-top:24px;}

  .method-card{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:22px;text-align:center;margin-bottom:14px;cursor:pointer;}
  .method-card .mc-icon{width:52px;height:52px;border-radius:16px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .method-card strong{display:block;font-size:15.5px;margin-bottom:4px;}
  .method-card span{font-size:12.5px;color:var(--muted);font-family:'Nunito',sans-serif;}

  .qr-card{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:24px;text-align:center;}
  .qr-box{width:140px;height:140px;background:repeating-linear-gradient(45deg,#0F172A 0 6px,#fff 6px 12px);border-radius:14px;margin:0 auto 16px;}

  .spinner-box{width:80px;height:80px;border-radius:50%;border:5px solid var(--teal-tint);border-top-color:var(--teal);margin:20px auto;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spinner-box{animation:none;}}

  .scan-banner{display:flex;align-items:center;gap:12px;background:var(--success-tint);border:1px solid #BBF7D0;border-radius:14px;padding:14px 16px;margin-bottom:20px;}
  .scan-banner .dot{width:36px;height:36px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .scan-banner strong{display:block;font-size:14px;}
  .scan-banner span{font-size:12px;color:#166534;font-family:'Nunito',sans-serif;}

  .success-icon{width:88px;height:88px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;color:#fff;margin:30px auto 20px;}

  .list-item{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:pointer;}
  .list-item.flagged{background:var(--warning-tint);border-color:#FDE68A;}
  .li-icon{width:40px;height:40px;border-radius:12px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .li-main{flex:1;min-width:0;}
  .li-main strong{display:block;font-size:14px;}
  .li-main span{display:block;font-size:11.5px;color:var(--muted);font-family:'Nunito',sans-serif;margin-top:1px;}
  span.badge-new{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--warning);color:#fff;text-transform:uppercase;letter-spacing:.03em;margin-left:6px;}
  .status-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .status-pill.online{background:var(--success-tint);color:var(--success);}
  .status-pill.quarantine{background:var(--warning-tint);color:var(--warning);}

  .detail-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .dh-icon{width:52px;height:52px;border-radius:16px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sec-label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;font-family:'Nunito',sans-serif;}
  .setting-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;}
  .sr-icon{width:36px;height:36px;border-radius:11px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sr-main{flex:1;min-width:0;}
  .sr-main strong{display:block;font-size:13.5px;}
  .sr-main span{display:block;font-size:11.5px;color:var(--muted);font-family:'Nunito',sans-serif;margin-top:1px;}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;cursor:pointer;}
  .switch.on{background:var(--teal);}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;}
  .switch.on::after{left:21px;}

  .timer-row{display:flex;gap:8px;margin-bottom:10px;}
  .timer-chip{flex:1;text-align:center;padding:11px 4px;border:1.5px solid var(--border);border-radius:14px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
  .timer-chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  .net-option{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;}
  .net-option.active{border-color:var(--teal);background:var(--teal-tint);}
  .net-option .no-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .net-option strong{flex:1;font-size:13.5px;}

  .bottomnav{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:#fff;padding:10px 6px 16px;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted-2);cursor:pointer;font-family:'Nunito',sans-serif;}
  .bn-item.active{color:var(--teal-dark);}

  .page-crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:18px;font-family:'Nunito',sans-serif;}

  /* --- Global search (shell) ---
     Naming convention for Task 7: everything mobile-search-scoped uses the
     `.mobile-search-*` prefix, mirroring the desktop file's unprefixed
     `.search-*` classes 1:1 (trigger has no desktop equivalent — desktop's
     search input lives permanently in the topbar):
       .mobile-search-trigger      -> desktop has no equivalent (pill button that opens the overlay)
       .mobile-search-overlay      -> desktop .search-results-panel's container equivalent (full-screen here instead of a dropdown)
       .mobile-search-header       -> desktop .app-topbar-search (input + icon), plus a Cancel button
       .mobile-search-results      -> scrollable results list area (desktop equivalent is .search-results-panel's content)
       .mobile-search-group-label  -> desktop .search-group-label
       .mobile-search-result-row   -> desktop .search-result-row
       .mobile-search-result-icon  -> desktop .search-result-icon
       .mobile-search-result-main  -> desktop .search-result-main (strong/span/mark children keep the same tags)
       .mobile-search-result-chip  -> desktop .search-result-chip
       .mobile-search-empty        -> desktop .search-empty
     Task 7 should render result rows as:
       <div class="mobile-search-result-row" data-idx="N">
         <div class="mobile-search-result-icon">...</div>
         <div class="mobile-search-result-main"><strong>...</strong><span>...</span></div>
         <div class="mobile-search-result-chip">...</div>
       </div>
     grouped under <div class="mobile-search-group-label">LABEL</div>, with
     <mark> used inside .mobile-search-result-main for the matched substring
     (styling for <mark> is already defined below), and a
     <div class="mobile-search-empty">…</div> for the no-results state. */
  .mobile-search-trigger{flex-shrink:0;display:flex;align-items:center;gap:8px;margin:8px 22px 4px;padding:9px 14px;border:1.5px solid var(--border);border-radius:999px;background:#fff;color:var(--muted-2);font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;}
  .mobile-search-trigger svg{flex-shrink:0;color:var(--muted-2);}
  .mobile-search-trigger span{font-weight:600;}
  .mobile-search-trigger:active{border-color:var(--teal);background:var(--teal-tint);}

  /* Overlay covers everything below the statusbar (trigger row, scroll
     content, bottom nav) but deliberately leaves the notch + statusbar
     visible — on a real phone the status bar (clock/battery/signal) always
     stays on screen, even when an app shows a full-screen search UI, so
     covering it would look wrong. phone-inner is position:relative and the
     statusbar is 46px tall, hence top:46px here. */
  .mobile-search-overlay{position:absolute;top:46px;left:0;right:0;bottom:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;}
  .mobile-search-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1.5px solid var(--border);}
  .mobile-search-header input{flex:1;height:38px;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);padding:0 14px;font-family:'Nunito',sans-serif;font-size:13.5px;color:var(--text);min-width:0;}
  .mobile-search-header input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light);background:#fff;}
  .mobile-search-header button{flex-shrink:0;border:none;background:none;color:var(--teal-dark);font-weight:700;font-size:13.5px;font-family:'Nunito',sans-serif;cursor:pointer;padding:6px 2px;}
  .mobile-search-results{flex:1;overflow-y:auto;padding:6px 0 20px;}
  .mobile-search-group-label{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);padding:12px 20px 6px;font-family:'Nunito',sans-serif;}
  .mobile-search-result-row{display:flex;align-items:center;gap:12px;padding:11px 20px;background:#fff;border-top:1px solid var(--bg);cursor:pointer;}
  .mobile-search-group-label + .mobile-search-result-row{border-top:none;}
  .mobile-search-result-row.active,.mobile-search-result-row:hover{background:var(--teal-tint);}
  .mobile-search-result-icon{width:34px;height:34px;border-radius:10px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
  .mobile-search-result-main{flex:1;min-width:0;}
  .mobile-search-result-main strong{display:block;font-size:13.5px;}
  .mobile-search-result-main span{display:block;font-size:11.5px;color:var(--muted);font-family:'Nunito',sans-serif;margin-top:1px;}
  .mobile-search-result-main mark{background:var(--teal-light);color:var(--teal-dark);border-radius:3px;padding:0 2px;font-weight:700;}
  .mobile-search-result-chip{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--teal-dark);background:var(--teal-tint);border-radius:999px;padding:3px 8px;flex-shrink:0;white-space:nowrap;}
  .mobile-search-empty{padding:30px 20px;text-align:center;color:var(--muted-2);font-size:12.5px;font-family:'Nunito',sans-serif;}

  /* pulse applied to the on-screen row/element a search result navigates to, so the
     user's eye finds it after the overlay closes and goTo() re-renders the screen */
  .search-highlight-pulse{animation:searchPulse 2s ease-out;}
  @keyframes searchPulse{0%{box-shadow:0 0 0 3px var(--teal);}100%{box-shadow:0 0 0 0 transparent;}}

</style>
</head>
<body>

<div class="phone">
  <div class="phone-inner">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span>●●●●&nbsp;&nbsp;📶&nbsp;&nbsp;🔋</span></div>
    <div class="mobile-search-trigger" id="mobileSearchTrigger">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Search</span>
    </div>
    <div class="p-scroll" id="pScroll"><div class="p-content" id="screenContent"></div></div>
    <div class="mobile-search-overlay" id="mobileSearchOverlay" style="display:none;">
      <div class="mobile-search-header">
        <input type="text" id="mobileSearchInput" placeholder="Search devices, settings…" autocomplete="off">
        <button id="mobileSearchClose">Cancel</button>
      </div>
      <div class="mobile-search-results" id="mobileSearchResults"></div>
    </div>
    <div class="bottomnav" id="bottomNav" style="display:none;">
      <div class="bn-item" data-tab="devices" data-goto="devices">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <span>Devices</span>
      </div>
      <div class="bn-item" data-tab="network" data-goto="network">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5s4-5.5 10-5.5 10 5.5 10 5.5M5.5 12s3-4 6.5-4 6.5 4 6.5 4M9 15.5s1.5-2 3-2 3 2 3 2"/><circle cx="12" cy="19" r="1"/></svg>
        <span>Network</span>
      </div>
      <div class="bn-item" data-tab="settings" data-goto="settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </div>
    </div>
  </div>
</div>

<script>

  const screens = {

    connect: `
      <div class="brand-row"><div class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V9"/></svg></div><div class="brand-word">Sadd</div></div>
      <h1 class="scr-title">Let's connect to your router</h1>
      <p class="scr-sub">Choose how you'd like to connect.</p>
      <div class="method-card" data-goto="scanning">
        <div class="mc-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></div>
        <strong>Scan Barcode</strong>
        <span>Use your camera to scan the code on your router</span>
      </div>
      <div class="method-card" data-goto="btsearching">
        <div class="mc-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11L12 23V1l5.5 5.5-11 11"/></svg></div>
        <strong>Connect via Bluetooth</strong>
        <span>No camera needed &mdash; pair directly</span>
      </div>
    `,

    scanning: `
      <div class="page-crumb" data-goto="connect"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</div>
      <h1 class="scr-title">Scanning for your router</h1>
      <p class="scr-sub">Point your camera at the barcode on the bottom of your router.</p>
      <div class="qr-card">
        <div class="qr-box"></div>
        <span style="font-size:12px;color:var(--muted);">Looking for a barcode&hellip;</span>
      </div>
      <button class="btn btn-primary mt-24">Continue</button>
    `,

    scanfound: `
      <h1 class="scr-title">Router found!</h1>
      <p class="scr-sub">Living Room Router is ready to set up.</p>
      <div class="scan-banner">
        <div class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div><strong>Connected</strong><span>Your phone is talking to the router</span></div>
      </div>
      <button class="btn btn-primary">Continue</button>
    `,

    btsearching: `
      <div class="page-crumb" data-goto="connect"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</div>
      <h1 class="scr-title">Searching for nearby routers</h1>
      <p class="scr-sub">Make sure Bluetooth is turned on and you're near your router.</p>
      <div class="spinner-box"></div>
      <button class="btn btn-primary mt-24">Continue</button>
    `,

    btfound: `
      <h1 class="scr-title">Router found!</h1>
      <p class="scr-sub">We found a nearby router ready to pair.</p>
      <div class="setting-row">
        <div class="sr-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div class="sr-main"><strong>Living Room Router</strong><span>Signal: Strong</span></div>
      </div>
      <button class="btn btn-primary mt-24">Connect</button>
    `,

    admin: `
      <div class="page-crumb" data-goto="connect"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</div>
      <h1 class="scr-title">Name your router &amp; set a password</h1>
      <p class="scr-sub">This protects your router's settings, separate from your Wi-Fi password.</p>
      <div class="field"><label>Router name</label><input class="input" value="Living Room Router"></div>
      <div class="field"><label>New admin password</label><input class="input" type="password" value="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"></div>
      <button class="btn btn-primary">Continue</button>
    `,

    wifi: `
      <div class="page-crumb" data-goto="admin"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</div>
      <h1 class="scr-title">Set up your Wi-Fi</h1>
      <p class="scr-sub">This is what you'll use to connect your devices.</p>

    topology: `
      <h1 class="scr-title">Do you have one Wi-Fi box, or several?</h1>
      <p class="scr-sub">No need to know terms like &quot;bridge mode&quot; &mdash; just pick what matches your home.</p>

  };

  const forwardMap = {
    scanning:'scanfound', scanfound:'comfortlevel',
    btsearching:'btfound', btfound:'comfortlevel',
    admin:'wifi', wifi:'success', success:'devices'
  };

  const mainScreens = ['devices','devicedetail','network','settings','about','notifications'];

  const state = { screen: 'connect', searchResults: [], searchActiveIndex: -1 };

  function render(){
    document.getElementById('screenContent').innerHTML = screens[state.screen] || '';
    const nav = document.getElementById('bottomNav');
    const isMain = mainScreens.includes(state.screen);
    nav.style.display = isMain ? 'flex' : 'none';
    const activeTab = state.screen === 'devicedetail' ? 'devices' : ((state.screen === 'about' || state.screen === 'notifications') ? 'settings' : state.screen);
    document.querySelectorAll('.bn-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.tab === activeTab);
    });
    document.getElementById('pScroll').scrollTop = 0;
  }

  function goTo(screen){
    if(screens[screen] === undefined) return;
    state.screen = screen;
    render();
  }

  document.body.addEventListener('click', (e)=>{

    // search result row click — #mobileSearchResults is re-rendered via innerHTML on
    // every keystroke (renderSearchResults), so rows are handled through this single
    // delegated handler rather than a direct listener, which would go stale after the
    // first re-render
    const searchResultRow = e.target.closest('.mobile-search-result-row');
    if(searchResultRow){
      const idx = parseInt(searchResultRow.dataset.idx, 10);
      activateSearchResult(state.searchResults[idx]);
      return;
    }

    const gotoEl = e.target.closest('[data-goto]');
    if(gotoEl){ goTo(gotoEl.dataset.goto); return; }

    const sw = e.target.closest('.switch');
    if(sw){ sw.classList.toggle('on'); return; }

    const timer = e.target.closest('.timer-chip');
    if(timer){
      const row = timer.closest('.timer-row');
      row.querySelectorAll('.timer-chip').forEach(c=>c.classList.remove('active'));
      timer.classList.add('active');
      return;
    }

    const netOpt = e.target.closest('.net-option');
    if(netOpt){
      const list = netOpt.closest('.net-option-list');
      list.querySelectorAll('.net-option').forEach(o=>o.classList.remove('active'));
      netOpt.classList.add('active');
      return;
    }

    const device = e.target.closest('.list-item');
    if(device){ goTo('devicedetail'); return; }

    const primary = e.target.closest('.btn-primary');
    if(primary && forwardMap[state.screen]){ goTo(forwardMap[state.screen]); return; }

  });

  render();

  // ---- Global search index (hand-authored; matchText verified verbatim against each
  // screen's rendered HTML). Only 3 of the desktop's 7 types apply to this app's much
  // smaller screen set: device (Devices list), network (Wi-Fi/guest config), setting
  // (everything else — Settings, Notifications, About, and the onboarding flow).
  // Onboarding screens deliberately NOT indexed: scanning, scanfound, btsearching,
  // btfound and success are transient, low-static-text status screens (spinner/QR
  // placeholder/confirmation) a user wouldn't search for after setup is done.
  const searchIndex = [
    {type:'device', label:'Unknown device', sub:'New · Quarantine · Devices', screen:'devices', matchText:'Unknown device', keywords:'unknown new quarantine unrecognized device'},
    {type:'device', label:"Emma's iPhone", sub:'Online · Family · Devices', screen:'devices', matchText:"Emma's iPhone", keywords:'emma iphone phone family mobile'},
    {type:'device', label:'Living Room TV', sub:'Online · Family · Devices', screen:'devices', matchText:'Living Room TV', keywords:'tv television smart living room'},
    {type:'device', label:'Nest Thermostat', sub:'Online · IoT devices · Devices', screen:'devices', matchText:'Nest Thermostat', keywords:'nest thermostat temperature iot smart home'},

    {type:'network', label:'Wi-Fi name', sub:'Smith Family · Network', screen:'network', matchText:'Wi-Fi name', keywords:'wifi ssid name smith family network'},
    {type:'network', label:'Wi-Fi password', sub:'Network settings', screen:'network', matchText:'Wi-Fi password', keywords:'wifi password key passphrase network'},
    {type:'network', label:'Guest network', sub:'Isolated Wi-Fi for visitors · Network', screen:'network', matchText:'Guest network', keywords:'guest network visitors isolated wifi'},

    {type:'setting', label:'Admin password', sub:"Change your router's admin password · Settings", screen:'settings', matchText:'Admin password', keywords:'admin password change router login'},
    {type:'setting', label:'Notifications', sub:'3 enabled · Settings', screen:'settings', matchText:'Notifications', keywords:'notifications alerts push settings'},
    {type:'setting', label:'Help & About', sub:'App version 1.0.0 · Settings', screen:'settings', matchText:'Help & About', keywords:'help about version support settings'},
    {type:'setting', label:'Forget this router', sub:'Settings', screen:'settings', matchText:'Forget this router', keywords:'forget remove reset router settings'},

    {type:'setting', label:'New device joins', sub:'On · Notifications', screen:'notifications', matchText:'New device joins', keywords:'notification new device joins alert'},
    {type:'setting', label:'Threats blocked', sub:'On · Notifications', screen:'notifications', matchText:'Threats blocked', keywords:'notification threats blocked security alert'},
    {type:'setting', label:'Network goes offline', sub:'On · Notifications', screen:'notifications', matchText:'Network goes offline', keywords:'notification offline outage down alert'},

    {type:'setting', label:'App version', sub:'1.0.0 · About', screen:'about', matchText:'App version', keywords:'app version about number'},
    {type:'setting', label:'Where your Sadd router is made', sub:'Designed and assembled in the USA · About', screen:'about', matchText:'Where your Sadd router is made', keywords:'made usa manufactured assembled about'},
    {type:'setting', label:'Our pricing promise', sub:'No core security feature behind a paywall · About', screen:'about', matchText:'Our pricing promise', keywords:'pricing promise paywall free about'},
    {type:'setting', label:'Built on OpenWrt', sub:'Open-source router OS · About', screen:'about', matchText:'Built on OpenWrt', keywords:'openwrt open source firmware about'},

    {type:'setting', label:'Scan Barcode', sub:'Connect your router', screen:'connect', matchText:'Scan Barcode', keywords:'scan barcode camera connect setup'},
    {type:'setting', label:'Connect via Bluetooth', sub:'Connect your router', screen:'connect', matchText:'Connect via Bluetooth', keywords:'bluetooth pair connect setup'},
    {type:'setting', label:"I'm new to this", sub:'Comfort level · Setup', screen:'comfortlevel', matchText:"I'm new to this", keywords:'beginner new comfort level onboarding setup'},
    {type:'setting', label:'I know networking', sub:'Comfort level · Setup', screen:'comfortlevel', matchText:'I know networking', keywords:'expert experienced comfort level onboarding setup'},
    {type:'setting', label:'Just one Wi-Fi box', sub:'Your setup · Setup', screen:'topology', matchText:'Just one Wi-Fi box', keywords:'one router single box topology setup'},
    {type:'setting', label:'Several boxes or a mesh system', sub:'Your setup · Setup', screen:'topology', matchText:'Several boxes or a mesh system', keywords:'mesh multiple boxes topology setup'},
    {type:'setting', label:'Name your router & set a password', sub:'Setup', screen:'admin', matchText:'Name your router & set a password', keywords:'admin password name router setup'},
    {type:'setting', label:'Set up your Wi-Fi', sub:'Setup', screen:'wifi', matchText:'Set up your Wi-Fi', keywords:'wifi setup ssid password onboarding'},
  ];

  // ---- Global search: matching, grouping, rendering ----
  // hoisted lookup tables for search rendering (created once, not per keystroke) —
  // trimmed to only the types actually used in searchIndex above (device/network/setting)
  const searchGroupLabels = {device:'Devices', network:'Networks', setting:'Settings'};
  const searchChipFor = {device:'Open', network:'Open', setting:'Open'};
  const searchIconFor = {device:'📱', network:'🌐', setting:'⚙️'};
  // more specific/leaf-like selectors first, broad wrapper selectors last —
  // matching walks this list in order and stops at the first hit, so a wrapper never
  // wins over a more specific element nested inside it just because it comes first in
  // DOM order. Built from this file's actual row/container classes: .li-main (device
  // list rows), .sr-main (setting rows), .net-option (network choice rows),
  // .method-card (onboarding choice cards), .field label (form field labels),
  // .btn-danger-soft (destructive buttons), with .list-item/.setting-row/.field and
  // h1.scr-title (onboarding headlines with no wrapping row) as broader fallbacks.
  const highlightRowSelectors = ['.li-main','.sr-main','.net-option','.method-card','.field label','.btn-danger-soft','.btn-ghost','.list-item','.setting-row','.field','h1.scr-title'];

  function searchMatch(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const scored = [];
    for(const item of searchIndex){
      const hay = (item.label+' '+item.sub+' '+item.keywords).toLowerCase();
      if(!hay.includes(q)) continue;
      const score = item.label.toLowerCase().startsWith(q) ? 0 : item.label.toLowerCase().includes(q) ? 1 : 2;
      scored.push({item, score});
    }
    scored.sort((a,b)=>a.score-b.score);
    return scored.map(s=>s.item);
  }

  function groupResults(results){
    const groups = {};
    for(const r of results){
      if(!groups[r.type]) groups[r.type] = [];
      if(groups[r.type].length < 4) groups[r.type].push(r);
    }
    return Object.keys(groups).map(type=>({label:searchGroupLabels[type]||type, items:groups[type]}));
  }

  function highlightText(text, query){
    const i = text.toLowerCase().indexOf(query.toLowerCase());
    if(i === -1) return text;
    return text.slice(0,i) + '<mark>' + text.slice(i,i+query.length) + '</mark>' + text.slice(i+query.length);
  }

  function escapeHtml(text){
    return text.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function renderSearchResults(query){
    const panel = document.getElementById('mobileSearchResults');
    const results = searchMatch(query);
    state.searchResults = results;
    state.searchActiveIndex = -1;
    if(!results.length){
      panel.innerHTML = query.trim() ? '<div class="mobile-search-empty">No matches for "'+escapeHtml(query)+'"</div>' : '';
      return;
    }
    const groups = groupResults(results);
    let html = '';
    for(const g of groups){
      html += '<div class="mobile-search-group-label">'+g.label+'</div>';
      for(const item of g.items){
        // data-idx must reference the item's real position in the flat, score-sorted
        // `results` array (what click activation indexes into) — NOT a counter over
        // this regrouped/capped-at-4 structure, which is a different ordering.
        const realIdx = results.indexOf(item);
        html += '<div class="mobile-search-result-row" data-idx="'+realIdx+'"><div class="mobile-search-result-icon">'+searchIconFor[item.type]+'</div><div class="mobile-search-result-main"><strong>'+highlightText(item.label, query)+'</strong><span>'+highlightText(item.sub, query)+'</span></div><div class="mobile-search-result-chip">'+searchChipFor[item.type]+'</div></div>';
      }
    }
    panel.innerHTML = html;
  }

  function activateSearchResult(item){
    closeMobileSearch();
    goTo(item.screen);
    setTimeout(()=>highlightAndScroll(item.matchText), 80);
  }

  function highlightAndScroll(matchText){
    let target = null;
    for(const sel of highlightRowSelectors){
      target = Array.from(document.querySelectorAll(sel)).find(el => el.textContent.includes(matchText));
      if(target) break;
    }
    if(!target) return;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    target.classList.add('search-highlight-pulse');
    setTimeout(()=>target.classList.remove('search-highlight-pulse'), 2000);
  }

  // --- Global search shell: open/close chrome + input wiring ---
  const mobileSearchTrigger = document.getElementById('mobileSearchTrigger');
  const mobileSearchOverlay = document.getElementById('mobileSearchOverlay');
  const mobileSearchInput = document.getElementById('mobileSearchInput');
  const mobileSearchClose = document.getElementById('mobileSearchClose');
  const mobileSearchResultsPanel = document.getElementById('mobileSearchResults');

  function openMobileSearch(){
    mobileSearchOverlay.style.display = 'flex';
    mobileSearchInput.focus();
  }
  function closeMobileSearch(){
    mobileSearchOverlay.style.display = 'none';
    mobileSearchInput.value = '';
    mobileSearchResultsPanel.innerHTML = '';
    state.searchResults = [];
    state.searchActiveIndex = -1;
  }
  mobileSearchTrigger.addEventListener('click', openMobileSearch);
  mobileSearchClose.addEventListener('click', closeMobileSearch);
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && mobileSearchOverlay.style.display !== 'none'){
      closeMobileSearch();
    }
  });

  // #mobileSearchInput is static shell markup from Task 6 — it's never replaced via
  // innerHTML (only #mobileSearchResults is, per keystroke), so a direct listener here
  // is safe and simpler than routing through the delegated body handler. Keyboard
  // up/down/enter nav is intentionally skipped: this is a touch-first mobile search UI
  // with no physical/virtual keyboard arrow affordance, so tap-to-select on
  // .mobile-search-result-row (wired via the delegated click handler above) is the
  // primary interaction pattern. Escape-to-close (above) still applies.
  mobileSearchInput.addEventListener('input', (e)=>{
    renderSearchResults(e.target.value);
  });

</script>
