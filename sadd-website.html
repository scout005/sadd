<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --teal:#0D9488; --teal-dark:#0F766E; --teal-light:#CCFBF1; --teal-tint:#F0FDFA;
    --success:#16A34A; --success-tint:#F0FDF4;
    --warning:#D97706; --warning-tint:#FFFBEB;
    --error:#DC2626; --error-tint:#FEF2F2;
    --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --muted:#64748B; --muted-2:#94A3B8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#EEF2F6;color:var(--text);}
  svg{display:block;}

  /* ---------- top chrome ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:#0F172A;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;}
  .brand small{display:block;font-weight:400;color:#94A3B8;font-size:11.5px;margin-top:1px;}
  .toolbar-controls{display:flex;align-items:center;gap:10px;}
  .segmented{display:flex;background:#1E293B;border-radius:10px;padding:4px;gap:2px;}
  .seg-btn{border:none;background:transparent;color:#CBD5E1;font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;}
  .seg-btn.active{background:var(--teal);color:#fff;}

  .tabbar{position:sticky;top:60px;z-index:49;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto;}
  .tab{border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:14px 16px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);}

  .stage{padding:48px 24px 100px;}
  .stage-inner{max-width:1360px;margin:0 auto;display:flex;gap:36px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
  .frame-wrap{display:none;}
  .frame-wrap.show{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}

  /* ---------- notes card ---------- */
  .notes{width:300px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .notes .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--teal-dark);text-transform:uppercase;margin-bottom:8px;}
  .notes h3{font-size:16px;margin:0 0 10px;}
  .notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .notes li{margin-bottom:8px;}

  /* ---------- phone frame ---------- */
  .phone{width:375px;height:790px;background:#0B1120;border-radius:52px;padding:12px;box-shadow:0 40px 70px -25px rgba(15,23,42,.45);flex-shrink:0;}
  .phone-inner{width:100%;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#0B1120;border-radius:12px;z-index:5;}
  .statusbar{height:46px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600;}
  .p-scroll{flex:1;overflow-y:auto;}
  .p-content{padding:8px 22px 40px;}

  /* ---------- desktop browser frame ---------- */
  .browser{width:1040px;max-width:82vw;background:#fff;border-radius:16px;box-shadow:0 40px 70px -25px rgba(15,23,42,.35);overflow:hidden;flex-shrink:0;}
  .chrome{height:46px;background:#F1F5F9;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);}
  .dots span{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;}
  .d1{background:#FCA5A5;} .d2{background:#FCD34D;} .d3{background:#86EFAC;}
  .curl{flex:1;margin:0 14px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;}

  /* ---------- shared components ---------- */
  .logo-row{display:flex;align-items:center;gap:9px;margin:6px 0 22px;}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;}
  .logo-word{font-weight:800;font-size:17px;letter-spacing:-.01em;}

  h1.scr-title{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  p.scr-sub{font-size:14px;color:var(--muted);margin:0 0 26px;line-height:1.55;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text);}
  .input-wrap{position:relative;}
  .input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-family:inherit;font-size:14.5px;color:var(--text);background:#fff;}
  .input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light);}
  .input.with-icon{padding-right:44px;}
  .icon-btn-inline{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;}
  .hint{font-size:12px;color:var(--muted-2);margin-top:6px;}

  .strength{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .strength-bars{display:flex;gap:4px;flex:1;}
  .strength-bars span{height:5px;flex:1;border-radius:3px;background:var(--border);}
  .strength-bars span.on{background:var(--success);}
  .strength-label{font-size:12px;font-weight:600;color:var(--success);}

  .btn{width:100%;border:none;border-radius:11px;font-family:inherit;font-weight:700;font-size:14.5px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 8px 18px -8px rgba(13,148,136,.55);}
  .btn-secondary{background:#fff;color:var(--text);border:1.5px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--teal-dark);font-weight:600;}
  .btn-danger-soft{background:var(--error-tint);color:var(--error);}

  .divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted-2);font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .checkrow{display:flex;align-items:flex-start;gap:10px;margin:14px 0 20px;}
  .checkrow input{margin-top:3px;}
  .checkrow span{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .checkrow a{color:var(--teal-dark);font-weight:600;text-decoration:none;}

  .foot-link{text-align:center;font-size:13.5px;color:var(--muted);margin-top:22px;}
  .foot-link a{color:var(--teal-dark);font-weight:700;text-decoration:none;}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;}
  .chip-success{background:var(--success-tint);color:var(--success);}
  .chip-warning{background:var(--warning-tint);color:var(--warning);}

  .tip-box{background:var(--teal-tint);border:1px solid #99F6E4;border-radius:12px;padding:13px 14px;display:flex;gap:10px;font-size:12.5px;color:#0F5D57;line-height:1.55;margin-top:6px;}
  .tip-box svg{flex-shrink:0;color:var(--teal-dark);margin-top:1px;}

  /* progress */
  .progress-wrap{margin-bottom:26px;}
  .progress-steps{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--muted-2);margin-bottom:8px;}
  .progress-steps .cur{color:var(--teal-dark);}
  .progress-track{height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--teal);border-radius:4px;}

  /* back row */
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .back-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}

  /* social buttons */
  .social-row{display:flex;gap:10px;}
  .btn-social{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

  /* split desktop auth layout */
  .split{display:flex;min-height:640px;}
  .split-brand{width:42%;background:linear-gradient(155deg,#0D9488,#0B5F58 88%);color:#fff;padding:60px 46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .split-brand::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.06);right:-120px;bottom:-140px;}
  .split-brand::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.05);left:-60px;top:-60px;}
  .split-headline{font-size:27px;font-weight:800;line-height:1.28;letter-spacing:-.01em;position:relative;z-index:2;}
  .split-sub{font-size:14px;color:#B7E9E4;margin-top:12px;line-height:1.6;max-width:320px;position:relative;z-index:2;}
  .split-quote{font-size:13px;color:#DFF7F4;background:rgba(255,255,255,.08);border-radius:12px;padding:16px;line-height:1.6;position:relative;z-index:2;}
  .split-form{flex:1;padding:60px 68px;display:flex;flex-direction:column;justify-content:center;}
  .split-form .inner{max-width:380px;width:100%;margin:0 auto;}

  /* wizard desktop (no split) */
  .wizard-desk{padding:52px 0;display:flex;justify-content:center;}
  .wizard-card{width:100%;max-width:600px;padding:0 20px;}

  /* device rows */
  .scan-banner{display:flex;align-items:center;gap:12px;background:var(--success-tint);border:1px solid #BBF7D0;border-radius:12px;padding:13px 15px;margin-bottom:20px;}
  .scan-banner .dot{width:34px;height:34px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .scan-banner strong{display:block;font-size:14px;}
  .scan-banner span{font-size:12.5px;color:#166534;}

  .device-list{display:flex;flex-direction:column;gap:10px;}
  .device-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:12px 14px;}
  .device-row .d-icon{width:42px;height:42px;border-radius:11px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .device-row .d-main{flex:1;min-width:0;}
  .device-row .d-name{width:100%;border:none;background:transparent;font-weight:700;font-size:14px;font-family:inherit;color:var(--text);padding:2px 0;}
  .device-row .d-name:focus{outline:none;border-bottom:1.5px solid var(--teal);}
  .device-row .d-meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .device-row select{border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 10px;background:#fff;color:var(--text);}
  .device-row .signal{display:flex;gap:2px;align-items:flex-end;height:14px;margin-right:2px;}
  .device-row .signal span{width:3px;background:var(--success);border-radius:2px;}

  .desk-table-head{display:flex;padding:0 14px 10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);}

  /* mfa */
  .mfa-icon-lg{width:56px;height:56px;border-radius:16px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .mfa-toggle{display:flex;background:#F1F5F9;border-radius:11px;padding:4px;gap:4px;margin-bottom:22px;}
  .mfa-toggle button{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:700;padding:10px;border-radius:8px;cursor:pointer;color:var(--muted);}
  .mfa-toggle button.active{background:#fff;color:var(--teal-dark);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .otp-row{display:flex;gap:9px;margin:6px 0 8px;}
  .otp-box{width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;border:1.5px solid var(--border);border-radius:11px;font-family:inherit;}
  .otp-box:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light);}
  .resend-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 22px;font-size:12.5px;color:var(--muted);}

  /* utility */
  .mono{font-variant-numeric:tabular-nums;}
  .center{text-align:center;}
  .mt-24{margin-top:24px;}
  .mb-0{margin-bottom:0;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---------- dashboard shell ---------- */
  .dash-shell-desk{display:flex;min-height:640px;}
  .sidebar{width:216px;background:#F8FAFC;border-right:1px solid var(--border);padding:24px 14px;flex-shrink:0;}
  .sidebar .brand-mini{display:flex;align-items:center;gap:9px;padding:0 10px;margin-bottom:26px;}
  .sidebar .brand-mini span{font-weight:800;font-size:15px;}
  .sidenav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
  .sidenav-item.active{background:var(--teal-tint);color:var(--teal-dark);}
  .sidenav-item svg{flex-shrink:0;}
  .dash-main{flex:1;padding:32px 36px;overflow:auto;}
  .dash-main h2{font-size:20px;margin:0 0 2px;font-weight:800;}
  .dash-main .dash-date{font-size:13px;color:var(--muted);margin:0 0 22px;}

  .bottomnav{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:#fff;padding:8px 6px 14px;}
  .bottomnav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted-2);}
  .bottomnav .bn-item.active{color:var(--teal-dark);}

  /* ---------- status / quick actions ---------- */
  .status-card{background:var(--success-tint);border:1px solid #BBF7D0;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .status-card .s-dot{width:44px;height:44px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .status-card strong{font-size:15.5px;display:block;}
  .status-card span{font-size:12.5px;color:#166534;}
  .avatar-row{display:flex;margin-top:9px;}
  .avatar-row .av{width:25px;height:25px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px;}
  .avatar-row .av:first-child{margin-left:0;}

  .quick-actions{display:flex;gap:10px;margin-bottom:18px;}
  .qa-btn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer;}
  .qa-btn.danger{border-color:#FECACA;background:var(--error-tint);color:var(--error);}
  .qa-btn svg{color:var(--teal-dark);}
  .qa-btn.danger svg{color:var(--error);}

  .nav-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;display:flex;align-items:center;gap:13px;margin-bottom:10px;cursor:pointer;}
  .nav-card .nc-icon{width:42px;height:42px;border-radius:11px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-card .nc-main{flex:1;}
  .nav-card .nc-main strong{display:block;font-size:14px;}
  .nav-card .nc-main span{font-size:12px;color:var(--muted);}
  .nav-card .nc-chev{color:var(--muted-2);}

  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dcard{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;}
  .dcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .dcard-head strong{font-size:14px;}
  .dcard-big{font-size:26px;font-weight:800;margin:2px 0 2px;}
  .dcard-sub{font-size:12px;color:var(--muted);}
  .bar-chart{display:flex;align-items:flex-end;gap:4px;height:44px;margin:12px 0 4px;}
  .bar-chart span{flex:1;background:var(--teal-light);border-radius:3px 3px 0 0;}
  .bar-chart span.hi{background:var(--teal);}
  .mini-log{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .mini-log-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px;}
  .mini-log-row strong{color:var(--text);font-weight:600;}

  /* ---------- toggle switch ---------- */
  .switch{width:44px;height:26px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:.15s;}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s;}
  .switch.on{background:var(--teal);}
  .switch.on::after{left:21px;}

  .setting-row{display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .setting-row .sr-icon{width:38px;height:38px;border-radius:10px;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .setting-row .sr-main{flex:1;min-width:0;}
  .setting-row .sr-main strong{display:block;font-size:13.5px;}
  .setting-row .sr-main span{font-size:12px;color:var(--muted);}

  /* ---------- family selector ---------- */
  .fam-row{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px;padding-bottom:2px;}
  .fam-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border-radius:14px;cursor:pointer;width:62px;}
  .fam-chip .fc-av{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;}
  .fam-chip.active .fc-av{border-color:var(--teal);}
  .fam-chip span{font-size:11px;font-weight:600;color:var(--muted);text-align:center;}
  .fam-chip.active span{color:var(--text);}
  .fam-list-desk{display:flex;flex-direction:column;gap:6px;}
  .fam-list-item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:11px;cursor:pointer;}
  .fam-list-item.active{background:var(--teal-tint);}
  .fam-list-item .fc-av{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .fam-list-item strong{display:block;font-size:13px;}
  .fam-list-item span{font-size:11px;color:var(--muted);}

  /* ---------- radio card ---------- */
  .radio-card{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;}
  .radio-card.active{border-color:var(--teal);background:var(--teal-tint);}
  .radio-card .rc-dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;}
  .radio-card.active .rc-dot{border-color:var(--teal);}
  .radio-card.active .rc-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--teal);}
  .radio-card .rc-main strong{display:block;font-size:13.5px;}
  .radio-card .rc-main span{font-size:11.5px;color:var(--muted);}

  /* ---------- app block grid ---------- */
  .app-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .app-block-row{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;}
  .app-block-row .ab-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12.5px;flex-shrink:0;}
  .app-block-row .ab-main{flex:1;min-width:0;}
  .app-block-row .ab-main strong{display:block;font-size:12px;}
  .app-block-row .ab-main span{font-size:10px;color:var(--muted);}

  /* ---------- devices list / detail ---------- */
  .list-item{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:9px;cursor:pointer;}

  ===================================================================== */

  .rule-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:12px 14px;margin-bottom:9px;}
  .rule-row .rr-main{flex:1;min-width:0;}
  .rule-row .rr-main strong{font-size:12.5px;display:block;}
  .rule-row .rr-main .rr-path{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}

  .sidebar-advanced{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);}
  .sidebar-advanced .sa-label{font-size:9.5px;font-weight:800;color:var(--warning);text-transform:uppercase;letter-spacing:.05em;padding:0 12px;margin-bottom:8px;font-family:'Baloo 2',cursive;}

/* =====================================================================
   REAL APP SHELL — replaces the mockup-gallery chrome entirely
===================================================================== */
html,body{height:100%;}
body{font-family:'Nunito',system-ui,sans-serif;overflow-x:hidden;}

/* ---- Auth / onboarding: true full-page, no shell ---- */
.auth-view{min-height:100vh;display:flex;align-items:stretch;background:var(--bg);}
.auth-view > *{width:100%;}
.auth-view .split{min-height:100vh;}
.auth-view .wizard-desk{min-height:100vh;align-items:center;}

/* ---- App shell ---- */
.app-shell{display:none;min-height:100vh;background:var(--bg);}
.app-shell.show{display:flex;}

.app-sidebar{width:250px;flex-shrink:0;background:#fff;border-right:1.5px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.app-sidebar .brand-row{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:28px;}
.app-sidebar .brand-row .mark{width:32px;height:32px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.app-sidebar .brand-row span{font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;}
.app-sidebar nav{flex:1;}
.app-sidebar .sidenav-item{cursor:pointer;}
.app-sidebar .sidebar-foot{border-top:1.5px solid var(--border);padding-top:14px;margin-top:14px;}
.app-sidebar .foot-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
.app-sidebar .foot-item:hover{background:var(--bg);}
.app-sidebar .foot-user{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.app-sidebar .foot-user .av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:700;font-size:13px;flex-shrink:0;}
.app-sidebar .foot-user strong{display:block;font-size:12.5px;}
.app-sidebar .foot-user span{font-size:11px;color:var(--muted);}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.app-topbar{height:66px;flex-shrink:0;background:#fff;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5;}
.app-topbar-title{font-family:'Baloo 2',cursive;font-weight:700;font-size:18px;}
.app-topbar-actions{display:flex;align-items:center;gap:14px;}
.app-icon-btn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;position:relative;}
.app-icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--error);border:1.5px solid #fff;}
.app-avatar-btn{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:700;font-size:13.5px;cursor:pointer;}

.app-content{flex:1;padding:36px 40px 60px;max-width:1180px;width:100%;margin:0 auto;}
.app-content .wizard-desk{padding:0;justify-content:flex-start;min-height:0;}
.app-content .wizard-card{margin:0;}
.app-content .split-desk{border:1.5px solid var(--border);border-radius:22px;overflow:hidden;background:#fff;min-height:560px;}
.app-content .dash-main{padding:0 !important;max-width:none !important;}

/* keep back-btn usable inside the shell for narrow task screens (points back via JS backMap) */
.app-content .back-row{margin-bottom:4px;}
.page-crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:18px;}
.page-crumb:hover{color:var(--teal-dark);}

/* ---- Bottom nav (mobile only) ---- */
.bottom-nav-mobile{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid var(--border);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:20;}
.bnm-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);flex:1;cursor:pointer;}
.bnm-item.active{color:var(--teal-dark);}

/* =====================================================================
   RESPONSIVE — phones & narrow tablets
===================================================================== */
@media (max-width: 860px){
  /* shell restructure: sidebar out, bottom nav in */
  .app-sidebar{display:none;}
  .app-shell.show{flex-direction:column;}
  .app-main{width:100%;}
  .bottom-nav-mobile{display:flex;}
  .app-content{padding:20px 16px calc(84px + env(safe-area-inset-bottom));max-width:100%;}
  .app-topbar{padding:0 16px;height:58px;}
  .app-topbar-title{font-size:16px;}

  /* auth/onboarding full-page screens */
  .auth-view .split{flex-direction:column;min-height:auto;}
  .auth-view .split-brand{padding:26px 24px;min-height:0;}
  .auth-view .split-brand::after,.auth-view .split-brand::before{display:none;}
  .auth-view .split-headline{font-size:20px;}
  .auth-view .split-sub{display:none;}
  .auth-view .split-quote{display:none;}
  .auth-view .split-form{padding:28px 22px;}
  .auth-view .wizard-desk{padding:32px 18px;min-height:auto;}

  /* generic content containers stop being fixed-width */
  [style*="max-width:"]{max-width:100% !important;}
  .app-content .wizard-card{width:100%;}

  /* two-column / grid layouts collapse to one column */
  .grid-2,.card-grid{grid-template-columns:1fr !important;}

  /* master-detail patterns stack instead of sitting side by side */
  .split-desk{flex-direction:column;}
  .split-desk-list{width:100% !important;border-right:none;border-bottom:1.5px solid var(--border);max-height:260px;}
  .split-desk-detail{padding:22px 18px;}

  /* the five "QR/illustration next to settings" flex rows stack */
  [style*="align-items:flex-start"]{flex-direction:column;}
  [style*="width:260px;flex-shrink:0"],[style*="width:220px;flex-shrink:0"]{width:100% !important;}

  /* desktop-style data tables: hide column header, let value spans size naturally */
  .desk-table-head{display:none !important;}
  [style*="width:150px;text-align:center"],[style*="width:90px;text-align:center"],
  [style*="width:140px;text-align:center"],[style*="width:200px;"],[style*="width:60px;"]{
    width:auto !important;
  }

  /* sidebar-shell pages that were built with their own internal sidebar padding */
  .dash-main{padding:0 !important;}

  /* quick actions / device rows keep working, just tighten spacing */
  .quick-actions{gap:8px;}
  h1.scr-title{font-size:19px;}
}

@media (max-width: 480px){
  .app-content{padding:16px 14px calc(84px + env(safe-area-inset-bottom));}
  .card-grid,.grid-2{gap:10px;}
  .bnm-item span{font-size:10px;}
}
</style>

><button class=\"cred-icon-btn\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button></div>\n            </div>\n          </div>\n        </div>\n      </div></div>", "laptopvpn": "<div class=\"page-crumb\" data-goto=\"vpn\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>Back to Remote Access</div><div class=\"wizard-desk\"><div class=\"wizard-card\" style=\"max-width:620px;\">\n        <h1 class=\"scr-title\">Connect This Laptop</h1>\n        <p class=\"scr-sub\">Reach your home Wi-Fi, cameras, and smart devices securely \u2014 even from your work network.</p>\n        <div class=\"conn-toggle pill-toggle\" data-group=\"lvpn2\" style=\"max-width:420px;\">\n          <button class=\"active\" data-method=\"easy\">Easy setup</button>\n          <button data-method=\"manual\">Work / managed laptop</button>\n        </div>\n\n        <div data-panel=\"easy\" data-group=\"lvpn2\">\n          <div class=\"step-row\"><div class=\"step-num\">1</div><div class=\"step-text\">Download <strong>Sadd Connect</strong> for your laptop</div></div>\n          <div class=\"quick-actions\" style=\"max-width:340px;margin:6px 0 4px;\">\n            <div class=\"os-btn\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M0 3.4 9.8 2v9.3H0V3.4Zm10.9-1.5L24 0v11.1H10.9V1.9ZM0 12.7h9.8V22L0 20.6V12.7Zm10.9 0H24V24l-13-1.8V12.7Z\"/></svg>Windows</div>\n            <div class=\"os-btn\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16.4 1.3c0 1.1-.45 2.15-1.19 2.93-.8.85-2.07 1.49-3.14 1.4-.13-1.06.42-2.17 1.13-2.93.8-.85 2.19-1.5 3.2-1.4ZM20.5 16.7c-.33.76-.72 1.49-1.19 2.17-.65.94-1.19 1.6-1.58 1.95-.61.6-1.28.9-1.98.92-.5.01-1.12-.14-1.83-.45-.72-.31-1.38-.45-2-.45-.65 0-1.34.14-2.06.45-.72.31-1.3.47-1.74.48-.67.03-1.34-.29-2.02-.95-.42-.39-.99-1.07-1.68-2.05-.75-1.06-1.36-2.29-1.84-3.68-.52-1.51-.78-2.96-.78-4.37 0-1.61.35-3 1.05-4.17.55-.94 1.27-1.68 2.18-2.23.91-.55 1.89-.83 2.95-.85.54 0 1.24.17 2.11.49.87.33 1.42.5 1.67.5.19 0 .81-.19 1.86-.58.99-.35 1.83-.5 2.51-.44 1.86.15 3.25.88 4.18 2.19-1.66 1.01-2.48 2.42-2.46 4.23.02 1.41.53 2.59 1.54 3.53.46.44.96.77 1.52 1-.12.36-.25.7-.39 1.03Z\"/></svg>Mac</div>\n          </div>\n          <div class=\"step-row\"><div class=\"step-num\">2</div><div class=\"step-text\">Sign in with your Sadd account \u2014 same login as your phone app</div></div>\n          <div class=\"step-row\"><div class=\"step-num\">3</div><div class=\"step-text\">Click <strong>Connect</strong></div></div>\n          <div class=\"sec-label mt-24\">What it looks like once connected</div>\n          <div class=\"tray-preview\" style=\"max-width:420px;\">\n            <div class=\"tray-dot\"></div>\n            <div><strong>Connected to Smith Family Home</strong><span>Cameras and devices are now reachable</span></div>\n          </div>\n          <div class=\"tip-box mt-24\" style=\"max-width:480px;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4M12 8h.01\"/></svg><span>Your laptop gets its own secure certificate automatically \u2014 nothing to download or import by hand.</span></div>\n        </div>\n\n        <div data-panel=\"manual\" data-group=\"lvpn2\" style=\"display:none;\">\n          <p style=\"font-size:12.5px;color:var(--muted);margin:0 0 16px;\">If your company doesn't allow installing new apps, use this instead.</p>\n          <div class=\"grid-2\">\n            <div>\n              <div class=\"step-row\"><div class=\"step-num\">1</div><div class=\"step-text\">Download your configuration file</div></div>\n              <button class=\"btn btn-secondary\" style=\"width:auto;padding:11px 20px;\">Download .ovpn</button>\n              <div class=\"step-row mt-24\"><div class=\"step-num\">2</div><div class=\"step-text\">Open it in an OpenVPN-compatible app your IT team allows</div></div>\n              <div class=\"step-row\"><div class=\"step-num\">3</div><div class=\"step-text\">Connect using the built-in certificate</div></div>\n            </div>\n            <div>\n              <div class=\"sec-label\" style=\"margin-top:0;\">Server details</div>\n              <div class=\"tech-row\"><div class=\"tr-label\">Server</div><div class=\"tr-val\">smith-family.saddvpn.com</div></div>\n              <div class=\"tech-row\"><div class=\"tr-label\">Port</div><div class=\"tr-val\">1194 (UDP)</div></div>\n            </div>\n          </div>\n          <div class=\"result-card warn mt-24\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z\"/></svg><div><strong>Some company networks block VPN traffic</strong><span>Ask IT to allow outbound UDP port 1194, or try port 443 (TCP) instead.</span></div></div>\n        </div>\n      </div></div>"};
  const screenMeta = {"login": "auth", "signup": "auth", "mfa": "auth", "welcome": "auth", "setup": "auth", "discover": "auth", "connectrouter": "auth", "success": "auth", "dashboard": "app", "devices": "app", "parental": "app", "security": "app", "vpn": "app", "help": "app", "settings": "app", "advhub": "app", "advnetwork": "app", "advfirewall": "app", "guest": "app", "advqos": "app", "advwan": "app", "advlogs": "app", "advapi": "app", "advvpn": "app", "adblock": "app", "devcontrols": "app", "connectdevice": "app", "laptopvpn": "app"};
  const pageTitles = {"dashboard": "Home", "devices": "Devices", "parental": "Parental Controls", "security": "Security & Ad Block", "vpn": "Remote Access", "help": "Help & Fixes", "settings": "Settings", "guest": "Guest Wi-Fi", "advhub": "Advanced Settings", "advnetwork": "Network & VLANs", "advvpn": "VPN Server (OpenVPN)", "advfirewall": "Firewall & Port Forwarding", "advqos": "Traffic & QoS", "advwan": "Multi-WAN & Failover", "advlogs": "Diagnostics & Logs", "advapi": "Developer & API Access", "adblock": "Ad Blocking", "devcontrols": "Per-Device Controls", "connectdevice": "Connect a Device", "laptopvpn": "Connect a Laptop (VPN)"};

  const state = { screen: 'welcome' };

  function render(){
    const meta = screenMeta[state.screen] || 'app';
    const authEl = document.getElementById('authView');
    const shellEl = document.getElementById('appShell');

    if(meta === 'auth'){
      shellEl.classList.remove('show');
      authEl.style.display = 'flex';
      authEl.innerHTML = screens[state.screen] || '';
    } else {
      authEl.style.display = 'none';
      shellEl.classList.add('show');
      document.getElementById('appContent').innerHTML = screens[state.screen] || '';
      document.getElementById('pageTitle').textContent = pageTitles[state.screen] || '';
      document.querySelectorAll('.app-sidebar [data-goto]').forEach(el=>{
        el.classList.toggle('active', el.dataset.goto === state.screen);
      });
      document.querySelectorAll('.bnm-item').forEach(el=>{
        el.classList.toggle('active', el.dataset.goto === state.screen);
      });
    }
    window.scrollTo({top:0});
  }

  function goTo(screen){
    if(screens[screen] === undefined) return;
    state.screen = screen;
    render();
  }

  // ---- Navigation maps (same logic validated in the mockup prototype) ----
  const forwardMap = {
    welcome:'signup', login:'dashboard', signup:'mfa', mfa:'setup',
    setup:'discover', discover:'success', success:'dashboard'
  };
  const backMap = {
    signup:'welcome', mfa:'signup', setup:'mfa', discover:'setup',
    guest:'settings', help:'dashboard', settings:'dashboard',
    advhub:'settings', advnetwork:'advhub', advfirewall:'advhub', advqos:'advhub',
    advwan:'advhub', advlogs:'advhub', advapi:'advhub', advvpn:'advhub',
    adblock:'security', devcontrols:'parental', connectdevice:'devices', laptopvpn:'vpn'
  };
  const textLinkMap = {
    'Devices':'devices','Parental Controls':'parental','Security':'security',
    'Connect a laptop or PC':'laptopvpn','Network & VLANs':'advnetwork',
    'VPN Server (OpenVPN)':'advvpn','VPN Server':'advvpn',
    'Firewall & Port Forwarding':'advfirewall','Firewall & Ports':'advfirewall',
    'Traffic & QoS':'advqos','Multi-WAN & Failover':'advwan',
    'Diagnostics & Logs':'advlogs','Developer & API Access':'advapi',
    'Home':'dashboard','Remote Access':'vpn','Help':'help',
    'Guest network':'guest','Show advanced settings':'advhub','Ad Blocking':'adblock'
  };

  // ---- All interactivity as event delegation on document.body, so it
  //      survives every innerHTML swap without re-binding ----

  document.body.addEventListener('click', (e)=>{

    // any explicit data-goto link (sidebar items, breadcrumbs, etc.)
    const gotoEl = e.target.closest('[data-goto]');
    if(gotoEl){
      goTo(gotoEl.dataset.goto);
      return;
    }

    // toggle switches — always stop here so they never trigger row navigation
    const sw = e.target.closest('.switch');
    if(sw){ sw.classList.toggle('on'); return; }

    // password show/hide
    const pw = e.target.closest('.pw-toggle');
    if(pw){
      const input = pw.parentElement.querySelector('.pw-input');
      if(input) input.type = input.type === 'password' ? 'text' : 'password';
      return;
    }

    // segmented toggles: mfa-toggle / pill-toggle / conn-toggle (data-group + data-method)
    const segBtn = e.target.closest('.mfa-toggle button, .pill-toggle button, .conn-toggle button');
    if(segBtn){
      const group = segBtn.closest('[data-group]');
      const gid = group ? group.dataset.group : null;
      if(gid){
        group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        segBtn.classList.add('active');
        document.querySelectorAll('[data-panel][data-group="'+gid+'"]').forEach(p=>{
          p.style.display = p.dataset.panel === segBtn.dataset.method ? 'block' : 'none';
        });
      }
      return;
    }

    // radio-card selection
    const radio = e.target.closest('.radio-card');
    if(radio){
      const parent = radio.parentElement;
      parent.querySelectorAll('.radio-card').forEach(c=>c.classList.remove('active'));
      radio.classList.add('active');
      return;
    }

    // timer chip
    const timer = e.target.closest('.timer-chip');
    if(timer){
      const row = timer.closest('.timer-row');
      row.querySelectorAll('.timer-chip').forEach(c=>c.classList.remove('active'));
      timer.classList.add('active');
      return;
    }

    // family chip / family list item
    const fam = e.target.closest('.fam-chip, .fam-list-item');
    if(fam){
      const parent = fam.parentElement;
      parent.querySelectorAll('.fam-chip, .fam-list-item').forEach(c=>c.classList.remove('active'));
      fam.classList.add('active');
      return;
    }

    // devices list-item (mobile-style list state, reused here for the split-desk list)
    const listItem = e.target.closest('.list-item');
    if(listItem && listItem.closest('.split-desk-list, [data-panel="list"]')){
      const scope = listItem.closest('.split-desk-list, [data-panel="list"]');
      scope.querySelectorAll('.list-item').forEach(i=>i.classList.remove('active'));
      listItem.classList.add('active');
      return;
    }

    // back arrow
    const back = e.target.closest('.back-btn');
    if(back){ goTo(backMap[state.screen]); return; }

    // primary continue button (only acts if current screen has a forward destination)
    const primary = e.target.closest('.btn-primary');
    if(primary && forwardMap[state.screen]){ goTo(forwardMap[state.screen]); return; }

    // linking rows matched by label text
    const row = e.target.closest('.nav-card, .adv-row, .setting-row, .dcard');
    if(row){
      const strongEl = row.querySelector('strong');
      const label = (strongEl ? strongEl.textContent : row.textContent).trim();
      if(textLinkMap[label]){ goTo(textLinkMap[label]); return; }
    }
  });

  // OTP auto-advance (delegated input handler)
  document.body.addEventListener('input', (e)=>{
    const box = e.target.closest('.otp-box');
    if(!box) return;
    box.value = box.value.replace(/[^0-9]/g,'').slice(0,1);
    if(box.value){
      const all = Array.from(box.closest('.otp-row').querySelectorAll('.otp-box'));
      const i = all.indexOf(box);
      if(all[i+1]) all[i+1].focus();
    }
  });
  document.body.addEventListener('keydown', (e)=>{
    const box = e.target.closest('.otp-box');
    if(!box) return;
    if(e.key === 'Backspace' && !box.value){
      const all = Array.from(box.closest('.otp-row').querySelectorAll('.otp-box'));
      const i = all.indexOf(box);
      if(all[i-1]) all[i-1].focus();
    }
  });

  render();
</script>
